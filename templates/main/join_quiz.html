{% extends 'base.html' %}

{% block title %}Приєднання до гри | Онлайн-вікторина{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <h2>Приєднатися до {{ quiz.title }}?</h2>
        <p class="text-muted">Після підтвердження ви розпочнете участь у вікторині.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-success">Підтвердити участь</button>
            <a href="{% url 'quiz_detail' quiz.id %}" class="btn btn-outline-secondary">Назад</a>
        </form>
    </div>
</div>
{% endblock %}
